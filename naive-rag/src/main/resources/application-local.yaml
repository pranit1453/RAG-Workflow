spring:
  application:
    name: naive-rag
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/ai
    username: postgres
    password: 140503
    driver-class-name: org.postgresql.Driver
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  # Flyway Migration Configuration
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  # AI Configuration
  ai:
    chat:
      client:
        enabled: true
      memory:
        repository:
          jdbc:
            initialize-schema: always
    openai:
      api-key: ${API_KEY}
      base-url: https://integrate.api.nvidia.com/v1
      chat:
        model: nvidia/nemotron-3-ultra-550b-a55b
        temperature: 0.7
        max-tokens: 1000
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        api-key: <qdrant api key>
        collection-name: vector_store
        content-field-name: doc_content
        use-tls: false
        initialize-schema: true
# Logging Configuration
logging:
  file:
    name: logs/access-hub.log
  level:
    root: INFO
    com.pranit.accesshub: DEBUG
